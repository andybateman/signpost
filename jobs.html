<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entelar Group — Open Roles</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💼</text></svg>">
    <link href="https://fonts.cdnfonts.com/css/neue-power" rel="stylesheet">
    <style>
        :root {
            --navy:      #002E6D;
            --navy-deep: #001B41;
            --teal:      #1E5A7A;
            --coral:     #EA6852;
            --sky:       #A8C4E0;   /* light tint of the navy, for secondary text */
            --white:     #FFFFFF;
        }

        *, *::before, *::after { box-sizing: border-box; }
        * { margin: 0; padding: 0; }
        html, body { height: 100%; }

        body {
            font-family: 'Neue Power', sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            /* Deep navy, against the recognition board's warm off-white. Both
               run in the same playlist, so the two need to read as different
               screens the moment they come up — same brand palette, inverted. */
            background:
                radial-gradient(ellipse 55% 45% at 12% 0%, rgba(30,90,122,0.55) 0%, transparent 62%),
                radial-gradient(ellipse 45% 40% at 100% 100%, rgba(234,104,82,0.28) 0%, transparent 60%),
                linear-gradient(150deg, var(--navy) 0%, var(--navy-deep) 100%);
            position: relative;
        }

        .logo-egl {
            position: absolute;
            width: 150px;
            top: 34px;
            left: 40px;
        }
        /* The Spark mark is purple and all but vanishes on navy — carry it in
           white, the same treatment the brand uses on dark backgrounds. */
        .logo-spark {
            position: absolute;
            width: 130px;
            top: 38px;
            right: 40px;
            filter: brightness(0) invert(1);
            opacity: 0.92;
        }

        .kicker {
            position: absolute;
            top: 44px;
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(0.7rem, 1.1vw, 1rem);
            font-weight: 600;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--sky);
            white-space: nowrap;
        }

        /* ── Vacancy panel ── */
        .card {
            position: relative;
            display: flex;
            align-items: center;
            gap: clamp(1.5rem, 4vw, 5rem);
            width: min(88vw, 1660px);
            /* Holds the panel a consistent size whatever the role, and stops
               a one-line title leaving most of the screen empty */
            min-height: 54vh;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 24px;
            box-shadow: 0 40px 90px -30px rgba(0,0,0,0.55);
            padding: clamp(2.2rem, 4.5vw, 4.2rem) clamp(2rem, 4vw, 4.4rem);
            overflow: hidden;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--coral) 0%, #f2a07f 55%, var(--sky) 100%);
        }
        .card.out { opacity: 0; transform: translateY(14px); }

        .detail { flex: 1 1 auto; min-width: 0; text-align: left; }

        .eyebrow {
            font-size: clamp(0.85rem, 1.6vw, 1.45rem);
            font-weight: 600;
            letter-spacing: 0.26em;
            text-transform: uppercase;
            color: var(--coral);
        }

        .title {
            margin-top: 0.6rem;
            font-size: clamp(2.4rem, 6vw, 5.8rem);
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--white);
            line-height: 1.05;
        }

        .location {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.5em 1.2em;
            border-radius: 999px;
            background: rgba(168,196,224,0.16);
            color: var(--sky);
            font-size: clamp(1rem, 1.85vw, 1.65rem);
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem 0.9rem;
            margin-top: clamp(1rem, 2.2vw, 1.7rem);
        }
        .chip {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Helvetica Neue", Arial, sans-serif;
            padding: 0.42em 1em;
            border: 1.5px solid rgba(255,255,255,0.28);
            border-radius: 999px;
            font-size: clamp(0.95rem, 1.7vw, 1.55rem);
            font-weight: 500;
            color: rgba(255,255,255,0.88);
            white-space: nowrap;
        }

        .closing {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Helvetica Neue", Arial, sans-serif;
            margin-top: clamp(1.1rem, 2.4vw, 1.8rem);
            font-size: clamp(1.05rem, 2.1vw, 1.95rem);
            color: rgba(255,255,255,0.86);
        }
        .closing strong { color: var(--white); font-weight: 600; }
        /* Under a week to go — say so in coral */
        .closing.urgent strong { color: var(--coral); }

        /* ── Scan panel ── */
        /* The QR sits on white whatever the board does: scanners need the
           light quiet zone, and inverted codes are a coin toss on older
           phone cameras. */
        .scan {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.7rem;
            background: var(--white);
            border-radius: 18px;
            padding: clamp(0.9rem, 1.8vw, 1.4rem);
            box-shadow: 0 18px 40px -18px rgba(0,0,0,0.6);
        }
        .scan__code {
            width: clamp(160px, 22vw, 380px);
            height: auto;
            display: block;
            shape-rendering: crispEdges;   /* keep module edges hard when scaled */
        }
        .scan__label {
            font-size: clamp(0.75rem, 1.15vw, 1.15rem);
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--navy);
            text-align: center;
        }
        .scan__ref {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "Helvetica Neue", Arial, sans-serif;
            font-size: clamp(0.7rem, 1.05vw, 1.05rem);
            color: var(--teal);
            text-align: center;
        }

        /* Fallback when a role has no encoded QR — the data file predates it,
           or the URL was too long to encode. */
        .scan--text {
            background: transparent;
            box-shadow: none;
            padding: 0;
            text-align: right;
            align-items: flex-end;
        }
        .scan--text .scan__label { color: var(--sky); }
        .scan--text .scan__url {
            font-size: clamp(1.2rem, 2.5vw, 2.3rem);
            font-weight: 700;
            color: var(--white);
        }
        .scan--text .scan__ref { color: var(--sky); }

        .counter {
            position: fixed;
            bottom: 26px;
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(0.7rem, 1.1vw, 0.95rem);
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--sky);
            opacity: 0.8;
        }

        .progress {
            position: fixed;
            left: 0; bottom: 0;
            height: 5px;
            width: 100%;
            background: var(--coral);
            transform-origin: left center;
            transform: scaleX(0);
            opacity: 0.9;
        }
        .progress.run {
            transform: scaleX(1);
            transition: transform 15s linear;
        }

        /* Nothing open (or every ad has closed) — still send people to careers */
        .empty {
            display: none;
            text-align: center;
            padding: 0 2rem;
        }
        .empty h1 {
            font-size: clamp(1.8rem, 4vw, 3.2rem);
            font-weight: 700;
            color: var(--white);
        }
        .empty p {
            margin-top: 0.8rem;
            font-size: clamp(1rem, 2vw, 1.4rem);
            color: var(--sky);
        }

        @media (max-width: 900px) {
            .card { flex-direction: column; text-align: center; }
            .detail { text-align: center; }
            .meta { justify-content: center; }
        }

        @media (max-width: 600px) {
            .logo-egl { width: 96px; top: 18px; left: 18px; }
            .logo-spark { width: 84px; top: 22px; right: 18px; }
            .kicker { top: 84px; font-size: 0.62rem; letter-spacing: 0.24em; }
            .card { width: 90vw; }
        }

        @media (prefers-reduced-motion: reduce) {
            .card { transition: opacity 0.2s ease; }
            .card.out { transform: none; }
            .progress.run { transition: none; }
        }
    </style>
</head>

    <div class="empty" id="empty">
        <h1>Entelar Group Careers</h1>
        <p>No roles open right now — new vacancies go up at careers.sparknz.co.nz</p>
    </div>

    <div class="counter" id="counter"></div>
    <div class="progress" id="progress"></div>

    <script>
        // ── Config ────────────────────────────────────────────────────────
        const DATA_URL = 'jobs.json';
        const SLIDE_MS = 15000;   // 15 seconds per role (matches the bottom bar)
        const REFRESH_MS = 1800000;  // re-read the vacancy list every 30 minutes

        // Filled in by the build with the vacancies as at build time. The
        // hosted page leaves it null and relies on the fetch; the signage
        // build carries a copy so a player with no network still shows roles.
        const FALLBACK_JOBS = null;

        const DAY = 86400000;
        const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
                        'July', 'August', 'September', 'October', 'November', 'December'];

        const cardEl     = document.getElementById('card');
        const titleEl    = document.getElementById('title');
        const locationEl = document.getElementById('location');
        const metaEl     = document.getElementById('meta');
        const closingEl  = document.getElementById('closing');
        const scanEl     = document.getElementById('scan');
        const qrEl       = document.getElementById('qr');
        const labelEl    = document.getElementById('scanLabel');
        const refEl      = document.getElementById('ref');
        const emptyEl    = document.getElementById('empty');
        const counterEl  = document.getElementById('counter');
        const progressEl = document.getElementById('progress');

        // '21-Aug-2026' — the portal's own format — to a local Date at midnight.
        function parseClose(value) {
            const m = /^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/.exec((value || '').trim());
            if (!m) return null;
            const month = MONTHS.findIndex(name => name.slice(0, 3).toLowerCase() === m[2].toLowerCase());
            if (month < 0) return null;
            const d = new Date(Number(m[3]), month, Number(m[1]));
            return isNaN(d.getTime()) ? null : d;
        }

        // A role with no close date stays up; one that has closed never shows,
        // so a screen running a stale upload can't advertise a dead vacancy.
        function isOpen(job) {
            const close = parseClose(job.close);
            if (!close) return true;
            return close.getTime() + DAY > Date.now();
        }

        function daysLeft(close) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            return Math.round((close.getTime() - today.getTime()) / DAY);
        }

        // The QR matrix is encoded at build time and arrives as rows of '0'/'1'.
        // Drawn as one rectangle per run of dark modules — a few hundred rects
        // rather than a few thousand, which keeps older players comfortable.
        const QUIET = 4;   // modules of light margin the scanner needs

        function drawQR(rows) {
            if (!rows || !rows.length) return false;
            const size = rows.length + QUIET * 2;
            let rects = '';
            for (let r = 0; r < rows.length; r++) {
                const row = rows[r];
                let c = 0;
                while (c < row.length) {
                    if (row[c] === '1') {
                        let run = 1;
                        while (c + run < row.length && row[c + run] === '1') run++;
                        rects += '<rect x="' + (c + QUIET) + '" y="' + (r + QUIET) +
                                 '" width="' + run + '" height="1"/>';
                        c += run;
                    } else {
                        c++;
                    }
                }
            }
            qrEl.setAttribute('viewBox', '0 0 ' + size + ' ' + size);
            qrEl.innerHTML = '<rect width="' + size + '" height="' + size + '" fill="#ffffff"/>' +
                             '<g fill="#002E6D">' + rects + '</g>';
            return true;
        }

        function render(job) {
            titleEl.textContent = job.title || '';

            // Multi-site roles list every location; on a board that reads as a
            // wall of place names, so past three it becomes "+ n more".
            const places = (job.location || '').split(',').map(s => s.trim()).filter(Boolean);
            const shown = places.length > 3
                ? places.slice(0, 3).join(' · ') + ' + ' + (places.length - 3) + ' more'
                : places.join(' · ');
            locationEl.textContent = shown;
            locationEl.style.display = shown ? 'inline-block' : 'none';

            metaEl.innerHTML = '';
            [job.expertise, job.level, job.employment]
                .map(v => (v || '').trim())
                .filter(Boolean)
                .forEach(value => {
                    const chip = document.createElement('div');
                    chip.className = 'chip';
                    chip.textContent = value;
                    metaEl.appendChild(chip);
                });

            const close = parseClose(job.close);
            closingEl.classList.remove('urgent');
            if (close) {
                const left = daysLeft(close);
                const date = close.getDate() + ' ' + MONTHS[close.getMonth()] + ' ' + close.getFullYear();
                let tail = '';
                if (left <= 0) tail = ' — last day';
                else if (left === 1) tail = ' — 1 day left';
                else if (left <= 7) tail = ' — ' + left + ' days left';
                closingEl.innerHTML = 'Applications close <strong>' + date + tail + '</strong>';
                if (left <= 7) closingEl.classList.add('urgent');
            } else {
                closingEl.textContent = '';
            }

            // No QR for this role — fall back to the address in text so the
            // slide still tells people where to go.
            if (drawQR(job.qr)) {
                scanEl.className = 'scan';
                qrEl.style.display = '';
                labelEl.textContent = 'Scan to apply';
                refEl.textContent = job.ref ? 'Ref ' + job.ref : '';
            } else {
                scanEl.className = 'scan scan--text';
                qrEl.style.display = 'none';
                qrEl.innerHTML = '';
                labelEl.textContent = 'Apply at';
                refEl.innerHTML = '<span class="scan__url">careers.sparknz.co.nz</span>' +
                                  (job.ref ? '<br>Ref ' + job.ref : '');
            }
        }

        let queue = [];
        let idx   = 0;
        let timer = null;

        function restartProgress() {
            progressEl.classList.remove('run');
            void progressEl.offsetWidth; // force reflow so the transition replays
            progressEl.classList.add('run');
        }

        // Shrink the title so long role names stay inside the viewport on a
        // fixed signage screen — no scrollbars, nothing clipped.
        function fitCard() {
            // The panel is centred, so half of any excess height rises into
            // the logos and kicker. 0.70 keeps the top edge below them even
            // when a long role name wraps to several lines.
            const maxH = window.innerHeight * 0.70;
            titleEl.style.fontSize = '';   // reset to the CSS clamp default
            let size = parseFloat(getComputedStyle(titleEl).fontSize);
            let guard = 0;
            while (cardEl.offsetHeight > maxH && size > 16 && guard < 80) {
                size -= 1.5;
                titleEl.style.fontSize = size + 'px';
                guard++;
            }
        }

        function showCurrent() {
            render(queue[idx]);
            counterEl.textContent = queue.length > 1 ? (idx + 1) + ' of ' + queue.length : '';
            fitCard();
            restartProgress();
        }

        function advance() {
            cardEl.classList.add('out');           // fade the current role out
            setTimeout(() => {
                idx = (idx + 1) % queue.length;
                showCurrent();
                cardEl.classList.remove('out');    // fade the next one in
            }, 600);
        }

        function start(jobs) {
            queue = jobs;
            idx = 0;
            clearInterval(timer);
            timer = null;
            cardEl.style.display = '';
            progressEl.style.display = '';
            counterEl.style.display = '';
            emptyEl.style.display = 'none';
            showCurrent();
            if (queue.length > 1) {
                timer = setInterval(advance, SLIDE_MS);
            }
        }

        function showEmpty() {
            clearInterval(timer);
            timer = null;
            queue = [];
            cardEl.style.display = 'none';
            progressEl.style.display = 'none';
            counterEl.style.display = 'none';
            emptyEl.style.display = 'block';
        }

        window.addEventListener('resize', () => { if (queue.length) fitCard(); });

        // What is on screen now, so a refresh that changes nothing does not
        // interrupt the rotation mid-slide.
        let signature = null;

        function sign(jobs) {
            return jobs.map(j => j.ref + '|' + j.close + '|' + j.title).join('~');
        }

        // Show a vacancy list, whatever its source. Roles past their close
        // date are dropped here as well as at fetch time, so a stale file
        // runs down to the empty state rather than advertising a dead role.
        function apply(all) {
            const open = Array.isArray(all) ? all.filter(isOpen) : [];
            const next = sign(open);
            if (next === signature) return;   // nothing changed, leave it alone
            signature = next;
            if (open.length === 0) { showEmpty(); return; }
            start(open);
        }

        async function load() {
            try {
                const res = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const all = await res.json();
                if (!Array.isArray(all)) throw new Error('not a list');
                apply(all);
                return true;
            } catch (e) {
                console.warn('jobs fetch failed', e);
                return false;
            }
        }

        async function init() {
            const live = await load();
            // The fetch is the source of truth; the embedded copy only covers
            // the case where the player cannot reach it.
            if (!live) {
                if (Array.isArray(FALLBACK_JOBS)) apply(FALLBACK_JOBS);
                else showEmpty();
            }
            // Keep pulling. A signage player runs for days, so without this a
            // new vacancy would wait for a reboot.
            setInterval(load, REFRESH_MS);
        }

        init();
    </script>
</body>
</html>
