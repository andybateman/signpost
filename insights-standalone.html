<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entelar Group Insights</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><rect fill='%23002E6D' width='200' height='200'/><text x='50%' y='50%' font-size='120' font-weight='bold' fill='%23EA6852' text-anchor='middle' dominant-baseline='middle' font-family='Arial'>i</text></svg>">
    <link href="https://fonts.cdnfonts.com/css/neue-power" rel="stylesheet">
    <style>
        :root {
            --navy:      #002E6D;
            --navy-deep: #001B41;
            --teal:      #1E5A7A;
            --coral:     #EA6852;
            --sky:       #D2E2F2;   /* light tint of the navy, for secondary text; 7:1 or better */
            --peach:     #FBD9CA;   /* warm tint for the closing-soon warning; 7:1 or better */
            --white:     #FFFFFF;
        }

        *, *::before, *::after { box-sizing: border-box; }
        * { margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; }

        body {
            font-family: 'Neue Power', sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
            color: var(--white);
            /* Deep navy, against the recognition board's warm off-white. Both
               run in the same playlist, so the two need to read as different
               screens the moment they come up: same brand palette, inverted. */
            background:
                radial-gradient(ellipse 55% 45% at 12% 0%, rgba(30,90,122,0.55) 0%, transparent 62%),
                radial-gradient(ellipse 45% 40% at 100% 100%, rgba(234,104,82,0.28) 0%, transparent 60%),
                linear-gradient(150deg, var(--navy) 0%, var(--navy-deep) 100%);
            position: relative;
        }

        
        /* Screen legibility standard (Entelar Group, 2026-11-19), section 4 of
           SCREEN_LEGIBILITY.md: fixed 1920 x 1080 stage scaled to the window.
           Margins 96px at the sides, 54px top and bottom. Title 96px stepping
           down to 72px, three lines at most. Kicker and date 40px. QR code at
           least 300px with a 40px label. Text sits on solid panels only. */
        #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; }
        .logo-egl { position: absolute; width: 160px; top: 54px; left: 96px; }
        .logo-spark { position: absolute; width: 110px; top: 54px; right: 96px; filter: brightness(0) invert(1); opacity: 0.95; }
        .kicker {
            position: absolute; top: 62px; left: 50%; transform: translateX(-50%);
            font-size: 40px; font-weight: 600; line-height: 1.2; letter-spacing: 0.1em;
            text-transform: uppercase; color: var(--sky); white-space: nowrap;
        }
        .card {
            position: absolute; left: 96px; top: 176px; width: 1728px; height: 850px;
            display: flex; align-items: stretch; gap: 64px; padding: 56px 64px;
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.16);
            border-radius: 24px; box-shadow: 0 40px 90px -30px rgba(0,0,0,0.55); overflow: hidden;
            visibility: hidden;
        }
        .card::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px;
            background: linear-gradient(90deg, var(--coral) 0%, #f2a07f 55%, var(--sky) 100%);
        }
        .detail { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; text-align: left; }
        .title {
            font-size: 96px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.15;
            color: var(--white); overflow-wrap: break-word; hyphens: none;
            max-height: calc(3 * 1.15em); overflow: hidden;
        }
        .title.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
        .guest {
            margin-top: 36px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 56px; font-weight: 600; line-height: 1.25; color: var(--sky);
        }
        .meta { margin-top: 36px; display: flex; align-items: center; gap: 40px; }
        .date {
            font-size: 40px; font-weight: 600; line-height: 1.2; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--peach);
        }
        /* Image on its own solid panel, with no text over it. It is dropped
           when the image fails to load. */
        .media {
            flex: 0 0 auto; height: 210px; border-radius: 14px; overflow: hidden;
            background: var(--navy-deep); border: 1px solid rgba(255,255,255,0.16);
        }
        .media img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .side { flex: 0 0 auto; display: flex; flex-direction: column; justify-content: center; }
        /* The QR carries its own 4-module white quiet zone inside the SVG. */
        .scan {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            background: var(--white); border-radius: 18px; padding: 12px 12px 20px;
            box-shadow: 0 18px 40px -18px rgba(0,0,0,0.6);
        }
        .scan svg { display: block; shape-rendering: crispEdges; }
        .scan__label { font-size: 40px; font-weight: 700; line-height: 1.2; letter-spacing: 0.02em; color: var(--navy); text-align: center; }
        .progress { display: none; }
    </style>
</head>

  var stageEl = document.getElementById('stage');
  function fitStage() {
    var w = window.innerWidth, h = window.innerHeight;
    var k = Math.min(w / 1920, h / 1080);
    stageEl.style.transform = 'translate(' + (w - 1920 * k) / 2 + 'px,' + (h - 1080 * k) / 2 + 'px) scale(' + k + ')';
  }
  window.addEventListener('resize', fitStage);
  fitStage();

  function tidy(s) { return String(s || '').replace(/\s+/g, ' ').replace(/\s[\u2014\u2013]\s/g, ': ').replace(/[\u2014\u2013]/g, '-').trim(); }

  // Pull a guest out of "... with Name" or "...: An Interview with Name".
  function splitTitle(raw) {
    var t = tidy(raw), m;
    m = /^(.*?)[\s:,\-]*(?:an?\s+)?interview\s+with\s+(.+)$/i.exec(t);
    if (!m) m = /^(.*)\bwith\s+(.+)$/i.exec(t);
    if (m && m[1].replace(/[\s:,\-]/g, '').length > 3) {
      var guest = m[2].replace(/^Entelar Group(?:'s|’s)\s+/i, '').trim();
      return { title: m[1].replace(/[\s:,\-]+$/, ''), guest: guest };
    }
    return { title: t, guest: '' };
  }

  function fmtDate(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
    if (!m) return '';
    return Number(m[3]) + ' ' + MONTHS[Number(m[2]) - 1] + ' ' + m[1];
  }

  function parseFeed(xmlText, kind) {
    var doc = new DOMParser().parseFromString(xmlText, 'text/xml');
    var out = [];
    var nodes = doc.getElementsByTagName('item');
    for (var i = 0; i < nodes.length; i++) {
      var it = nodes[i];
      function txt(tag) { var e = it.getElementsByTagName(tag)[0]; return e ? (e.textContent || '').trim() : ''; }
      var title = txt('title'), link = txt('link');
      if (!title || !/^https?:/i.test(link)) continue;
      var d = new Date(txt('pubDate')), iso = '';
      if (!isNaN(d.getTime())) iso = d.toISOString().slice(0, 10);
      var image = '', summary = '';
      var enc = it.getElementsByTagName('enclosure')[0];
      if (enc && /^image/.test(enc.getAttribute('type') || '')) image = enc.getAttribute('url') || '';
      var html = new DOMParser().parseFromString(txt('description'), 'text/html');
      if (!image) {
        var im = html.querySelector('img.hs-featured-image') || html.querySelector('img');
        if (im) image = im.getAttribute('src') || '';
      }
      var wrap = html.querySelector('.hs-featured-image-wrapper');
      if (wrap) wrap.remove();
      summary = (html.body.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 200);
      out.push({ kind: kind, title: title, link: link, date: iso, image: image, summary: summary });
    }
    return out;
  }

  function fetchFeed(f) {
    return new Promise(function (resolve) {
      var done = false;
      var timer = setTimeout(function () { if (!done) { done = true; resolve([]); } }, TIMEOUT_MS);
      function finish(v) { if (!done) { done = true; clearTimeout(timer); resolve(v); } }
      try {
        var ctl = (typeof AbortController === 'function') ? new AbortController() : null;
        if (ctl) setTimeout(function () { try { ctl.abort(); } catch (e) {} }, TIMEOUT_MS);
        fetch(f.url, ctl ? { signal: ctl.signal } : {})
          .then(function (r) { if (!r.ok) throw new Error('http'); return r.text(); })
          .then(function (t) { finish(parseFeed(t, f.kind)); })
          .catch(function () { finish([]); });
      } catch (e) { finish([]); }
    });
  }

  // Live items first (fresher), then embedded ones not already present.
  function merge(live, embedded) {
    var seen = {}, out = [];
    live.concat(embedded).forEach(function (it) {
      if (!it || !it.link || seen[it.link]) return;
      seen[it.link] = true; out.push(it);
    });
    return out;
  }

  function readSeen() {
    try { var v = JSON.parse(localStorage.getItem(SEEN_KEY) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; }
  }
  function writeSeen(a) { try { localStorage.setItem(SEEN_KEY, JSON.stringify(a)); } catch (e) {} }

  function rnd(n) { return Math.floor(Math.random() * n); }

  function pick(items) {
    var m = /[#&]item=(\d+)/.exec(location.hash || '');
    if (m) {
      var ordered = items.filter(function (i) { return i.kind === 'podcast'; }).concat(items.filter(function (i) { return i.kind !== 'podcast'; }));
      return ordered[Number(m[1]) % ordered.length];
    }
    var seen = readSeen();
    var links = items.map(function (i) { return i.link; });
    seen = seen.filter(function (l) { return links.indexOf(l) >= 0; });
    var fresh = items.filter(function (i) { return seen.indexOf(i.link) < 0; });
    if (!fresh.length) { seen = []; fresh = items.slice(); }
    var pods = fresh.filter(function (i) { return i.kind === 'podcast'; });
    var arts = fresh.filter(function (i) { return i.kind !== 'podcast'; });
    var pool;
    if (pods.length && arts.length) pool = Math.random() < 0.5 ? pods : arts;   // half and half, whatever the list sizes
    else pool = pods.length ? pods : arts;
    var chosen = pool[rnd(pool.length)];
    seen.push(chosen.link);
    writeSeen(seen);
    return chosen;
  }

  var el = {
    kicker: document.getElementById('kicker'), card: document.getElementById('card'),
    title: document.getElementById('title'), guest: document.getElementById('guest'),
    date: document.getElementById('date'), media: document.getElementById('media'),
    img: document.getElementById('img'), qr: document.getElementById('qr'),
    scanLabel: document.getElementById('scanLabel')
  };

  // 96px, stepping down by 4px to no less than 72px; three lines at most.
  function fitTitle() {
    var t = el.title, size = 96;
    t.style.fontSize = size + 'px';
    t.classList.remove('clamp');
    while (size > 72 && t.scrollHeight > t.clientHeight + 1 && t.scrollHeight > size * 1.15 * 3 + 2) {
      size -= 4; t.style.fontSize = size + 'px';
    }
    if (t.scrollHeight > size * 1.15 * 3 + 2 && t.textContent.indexOf(': ') > 11) {
      // Still too long at 72px: keep the part before the colon rather than cut mid-word.
      t.textContent = t.textContent.split(': ')[0];
      size = 96; t.style.fontSize = size + 'px';
      while (size > 72 && t.scrollHeight > size * 1.15 * 3 + 2) { size -= 4; t.style.fontSize = size + 'px'; }
    }
    if (t.scrollHeight > size * 1.15 * 3 + 2) t.classList.add('clamp');   // last resort: three lines with an ellipsis
  }

  function drawQR(url) {
    var svg = el.qr;
    try {
      var q = qrcode(0, 'M'); q.addData(url); q.make();
      var n = q.getModuleCount(), cell = Math.max(6, Math.ceil(300 / n)), quiet = 4, size = (n + quiet * 2) * cell;
      var d = '';
      for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (q.isDark(r, c)) d += 'M' + ((c + quiet) * cell) + ' ' + ((r + quiet) * cell) + 'h' + cell + 'v' + cell + 'h-' + cell + 'z';
      svg.setAttribute('viewBox', '0 0 ' + size + ' ' + size);
      svg.setAttribute('width', size); svg.setAttribute('height', size);
      svg.innerHTML = '<rect width="' + size + '" height="' + size + '" fill="#fff"/><path d="' + d + '" fill="#000"/>';
      return true;
    } catch (e) { return false; }
  }

  function show(item) {
    var isPod = item.kind === 'podcast';
    var parts = isPod ? splitTitle(item.title) : { title: tidy(item.title), guest: '' };
    el.kicker.textContent = isPod ? 'Totally Connected Podcast' : 'Entelar Group Insights';
    el.title.textContent = parts.title;
    el.guest.textContent = parts.guest ? 'With ' + parts.guest : '';
    el.guest.style.display = parts.guest ? '' : 'none';
    el.date.textContent = fmtDate(item.date);
    el.date.style.display = el.date.textContent ? '' : 'none';
    el.scanLabel.textContent = isPod ? 'Scan to listen' : 'Scan to read';
    var ok = drawQR(item.link);
    document.getElementById('scan').style.display = ok ? '' : 'none';
    el.card.classList.toggle('noscan', !ok);
    el.media.style.display = 'none';
    if (item.image) {
      var probe = new Image();
      probe.onload = function () { el.img.src = item.image; el.media.style.display = ''; };
      probe.onerror = function () { el.media.style.display = 'none'; };
      probe.src = item.image;
    }
    el.card.style.visibility = 'visible';
    fitTitle();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);
  }

  Promise.all(FEEDS.map(fetchFeed)).then(function (r) {
    var items = merge(r[0].concat(r[1]), EMBEDDED);
    if (!items.length) items = merge([], EMBEDDED);
    show(pick(items));
  });
})();

</script>
