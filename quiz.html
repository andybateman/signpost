<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><rect fill='%23002E6D' width='200' height='200'/><text x='50%' y='50%' font-size='120' font-weight='bold' fill='%231E5A7A' text-anchor='middle' dominant-baseline='middle' font-family='Arial'>EGL</text></svg>" type="image/svg+xml">
    <link href="https://fonts.cdnfonts.com/css/neue-power" rel="stylesheet">
    <style>
        :root {
            --teal:         #1E5A7A;
            --coral:        #EA6852;
            --peach:        #F4BEA8;
            --sky:          #A8C4E0;
            --petrol:       #0E3D4E;
            --petrol-deep:  #072430;
            --label:        #D2E2F2;   /* 7:1 or better on the petrol board */
            --label-answer: #FBD9CA;   /* peach tint, 7:1 or better */
        }

        /* Modern CSS reset */
        *, *::before, *::after { box-sizing: border-box; }
        * { margin: 0; padding: 0; }
        html, body { height: 100%; }
        img, picture, video, canvas, svg { display: block; max-width: 100%; }
        input, button, textarea, select { font: inherit; }

        /* The recognition board is warm off-white and the careers board is deep
           navy. All three run in the same playlist, so this one takes the third
           corner of the brand palette — petrol teal — to read as a different
           screen the moment it comes up. It is also the only board of the set
           with no card: the question sits directly on the background. */
        body {
            font-family: 'Neue Power', sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
            position: relative;
            color: #ffffff;
            background:
                radial-gradient(ellipse 60% 50% at 82% -8%, rgba(30,90,122,0.55) 0%, transparent 62%),
                radial-gradient(ellipse 55% 45% at 0% 108%, rgba(234,104,82,0.20) 0%, transparent 60%),
                linear-gradient(155deg, var(--petrol) 0%, var(--petrol-deep) 100%);
        }

        /* Screen legibility standard (Entelar Group, 2026-11-19): everything is
           laid out on a fixed 1920 x 1080 stage that is scaled to fit the
           window, so the pixel sizes below hold on any screen. Safe margin is
           5%: 96px at the sides, 54px top and bottom. Headline 96px, labels
           40px. */
        #stage {
            position: absolute;
            left: 0;
            top: 0;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            transform-origin: 0 0;
        }

        .logo-left {
            position: absolute;
            width: 220px;
            height: auto;
            top: 54px;
            left: 96px;
        }

        .logo {
            position: absolute;
            width: 260px;
            top: 54px;
            right: 96px;
        }

        /* Matches the kicker on the other two boards, so the set still reads
           as one family even though the colours differ. */
        .kicker {
            position: absolute;
            top: 62px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 40px;
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--label);
            white-space: nowrap;
        }

        /* The question stays on screen; the answer fades in underneath it (2026-11-19), so a
           page the player loaded early never shows the answer first. */
        #qa {
            position: absolute;
            top: 230px;
            left: 144px;
            width: 1632px;
            display: flex;
            flex-direction: column;
            gap: 56px;
        }

        .panel {
            position: static;
            width: 1632px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 28px;
            text-align: left;
            opacity: 1;
        }

        #answer {
            opacity: 0;
            pointer-events: none;
        }

        .marker {
            display: inline-flex;
            align-items: center;
            gap: 20px;
            font-size: 40px;
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--label);
        }

        .marker::before {
            content: "";
            width: 54px;
            height: 3px;
            background: currentColor;
            opacity: 0.7;
        }

        #answer .marker { color: var(--label-answer); }

        /* 96px headline, three lines at most. fitText() in the script steps a
           long question down in 4px steps, never below 72px. */
        .panel h2 {
            font-size: 96px;
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: -0.01em;
            /* No hyphens: never split a word across two lines. break-word is
               left only as an overflow guard for a pathologically long word. */
            overflow-wrap: break-word;
            hyphens: none;
        }

        #question h2 { color: #ffffff; }
        #answer h2   { color: var(--label-answer); }

        /* A hairline along the foot of the screen, filling as the answer
           approaches. Replaces two sliding pills and, being a transform, it
           animates on the compositor and needs no resize handling. */
        #progress {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 6px;
            background: rgba(255, 255, 255, 0.10);
        }

        #progress-fill {
            display: block;
            height: 100%;
            width: 100%;
            transform: scaleX(0);
            transform-origin: left center;
            background: linear-gradient(90deg, var(--coral) 0%, #F2A07F 60%, var(--peach) 100%);
        }

        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

    <div class="kicker">NZ Trivia</div>

    <div id="qa">
    <section id="question" class="panel">
        <p class="marker">Question</p>

</div>

    <script>
    (function () {
        'use strict';

        // Cycle timings in milliseconds, measured from page load.
        //
        // The player reloads this page for each slide and gives it a 16s slot,
        // so everything must land inside that budget: the bar sweep finishes at
        // 10s exactly as the answer appears, leaving ~6s to read the answer
        // before the playlist moves on. If the slot length changes in the
        // CommBox console, these need to change with it.
        const TIMING = {
            INITIAL_DELAY: 2000,
            ANIMATION_DURATION: 8000,
            FADE_DURATION: 250,
            QUESTION_FADE_OUT: 9750,
            ANSWER_FADE_IN: 10000
        };

        // NZ trivia questions
        const quizData = [
            ["Which is the largest of New Zealand's islands by area?", "South Island"],
            ["Which volcano is the highest peak on the North Island?", "Mount Ruapehu"],
            ["Which near-perfect volcanic cone dominates the Taranaki skyline?", "Taranaki Maunga (Mount Taranaki)"],
            ["Which South Island city's name comes from the Gaelic name for Edinburgh?", "Dunedin"],
            ["Hot Water Beach, where you can dig your own hot pool, is on which peninsula?", "Coromandel Peninsula"],
            ["Which city sits at the top of the South Island, near Abel Tasman National Park?", "Nelson"],
            ["Which South Island region is best known for its Sauvignon Blanc?", "Marlborough"],
            ["Which Otago town, on Lake Wakatipu, bills itself as the adventure capital?", "Queenstown"],
            ["Which island group lies about 860 km east of Christchurch?", "Chatham Islands"],
            ["Which sea separates New Zealand from Australia?", "Tasman Sea"],
            ["Which Waikato town is the home of the Hobbiton Movie Set?", "Matamata"],
            ["Which famous day hike crosses the volcanic Central Plateau, past the Emerald Lakes?", "Tongariro Alpine Crossing"],
            ["Which Canterbury coastal town is famous for whale watching?", "Kaikōura"],
            ["Ninety Mile Beach is in which region of New Zealand?", "Northland"],
            ["Which Mackenzie Country lake is famed for its turquoise water and its Church of the Good Shepherd?", "Lake Tekapo"],
            ["Mauao (Mount Maunganui) is a landmark in which Bay of Plenty city?", "Tauranga"],
            ["Which point is the southernmost spot on the South Island's mainland?", "Slope Point"],
            ["Which harbour does the Auckland Harbour Bridge cross?", "Waitematā Harbour"],
            ["Which alpine pass links Canterbury with the West Coast by road (State Highway 73)?", "Arthur's Pass"],
            ["Which Hauraki Gulf island is the largest and youngest volcano in Auckland's volcanic field?", "Rangitoto"],
            ["Which Canterbury peninsula was formed by two ancient volcanoes?", "Banks Peninsula"],
            ["Which Fiordland fiord, nicknamed the 'Sound of Silence', is larger and deeper than Milford Sound?", "Doubtful Sound"],
            ["Which North Island river has a Great Walk by canoe or kayak?", "Whanganui River"],
            ["Which Southland port town has a famous signpost at Stirling Point?", "Bluff"],
            ["Which island nature reserve sits off the coast north of Wellington?", "Kāpiti Island"],
            ["What does the Māori greeting 'Kia ora' mean?", "Hello (be well)"],
            ["What does the Māori phrase 'Kia kaha' mean?", "Be strong"],
            ["What is the Māori word for food?", "Kai"],
            ["What are the chocolate-coated, fish-shaped Kiwi lollies with a pink or white marshmallow centre called?", "Chocolate fish"],
            ["Which New Zealand ice cream flavour contains crunchy honeycomb toffee pieces?", "Hokey pokey"],
            ["What is the name of the New Zealand women's national rugby union team?", "Black Ferns"],
            ["What is the nickname of the New Zealand men's cricket team?", "Black Caps"],
            ["Which Kiwi author won the 1985 Booker Prize for 'The Bone People'?", "Keri Hulme"],
            ["Which Kiwi author won the Booker Prize in 2013 with 'The Luminaries'?", "Eleanor Catton"],
            ["Which Kiwi director made the film 'The Piano'?", "Jane Campion"],
            ["Which NZ comedy duo sang 'Business Time'?", "Flight of the Conchords"],
            ["Which Māori author wrote the novel 'The Whale Rider'?", "Witi Ihimaera"],
            ["Which native mountain parrot is known for its curiosity and cheeky behaviour?", "Kea"],
            ["What is the name of NZ's giant, flightless, nocturnal parrot?", "Kākāpō"],
            ["Which native tree is known as NZ's Christmas tree for its crimson flowers?", "Pōhutukawa"],
            ["Which giant kauri in Waipoua Forest is known as the 'Lord of the Forest'?", "Tāne Mahuta"],
            ["What is the Māori name for greenstone?", "Pounamu"],
            ["What is the Māori name for the spiral based on an unfurling fern frond?", "Koru"],
            ["Which Māori word is commonly used for New Zealanders of European descent?", "Pākehā"],
            ["What do Kiwis call a corner shop selling milk, bread and papers?", "A dairy"],
            ["What do Kiwis call an insulated box used to keep food and drink cold?", "A chilly bin"],
            ["What does the 'L' stand for in the NZ soft drink L&P?", "Lemon"],
            ["What was the kiwifruit originally called when exported from NZ?", "Chinese gooseberry"],
            ["The Bledisloe Cup is contested in rugby between New Zealand and which country?", "Australia"],
            ["What is the Māori word for a woven flax basket?", "Kete"],
            ["Which Dutch explorer was the first European to sight New Zealand, in 1642?", "Abel Tasman"],
            ["Which Polynesian navigator is traditionally credited with discovering Aotearoa?", "Kupe"],
            ["Which giant flightless bird, hunted by early settlers, is now extinct?", "Moa"],
            ["Which NZ runner won 800 m gold at the 1960 Rome Olympics?", "Peter Snell"],
            ["Which NZ-born physicist is known as the 'father of nuclear physics'?", "Ernest Rutherford"],
            ["What is the name of New Zealand's Antarctic base, opened in 1957?", "Scott Base"],
            ["In which year did the Auckland Harbour Bridge open?", "1959"],
            ["The New Zealand Company's first settlers arrived at Port Nicholson in 1840, founding which city?", "Wellington"],
            ["What was the 1905 touring All Blacks side known as?", "The Originals"],
            ["In which year did New Zealand become a Dominion?", "1907"],
            ["In which year did New Zealand switch from pounds to dollars?", "1967"],
            ["French settlers arrived in 1840 at which South Island town?", "Akaroa"],
            ["The 28th Māori Battalion served in which world war?", "World War II"],
            ["Which Invercargill man set a 1967 speed record at Bonneville on a modified Indian motorcycle?", "Burt Munro"],
            ["In which year did New Zealand first win the America's Cup?", "1995"],
            ["In which year did Te Papa open on the Wellington waterfront?", "1998"],
            ["In which year did regular television broadcasting begin in New Zealand?", "1960"],
            ["Which famous naturalist visited NZ aboard HMS Beagle in 1835?", "Charles Darwin"],
            ["Which NZ aviator flew solo from England to New Zealand in 1936?", "Jean Batten"],
            ["In which year was 'God Defend New Zealand' made a co-national anthem?", "1977"],
            ["What name is given to early 1800s inter-iwi conflicts fought with firearms?", "Musket Wars"],
            ["In which year did Auckland's Sky Tower open?", "1997"],
            ["Which NZ doctor founded the Plunket Society in 1907?", "Truby King"],
            ["Which Wellington-born engineer led NASA's Jet Propulsion Laboratory from 1954 to 1976?", "William Pickering"],
            ["Which NZ engineer is credited with developing the modern jet boat in the 1950s?", "Bill Hamilton"],
            ["What does 'URL' stand for?", "Uniform Resource Locator"],
            ["What does DNS do for the internet?", "Turns names into IP addresses"],
            ["How many bits are in a byte?", "8"],
            ["What does 'LAN' stand for?", "Local Area Network"],
            ["What does 'CPU' stand for?", "Central Processing Unit"],
            ["Which home device directs data between your network and the internet?", "Router"],
            ["What does 'SSD' stand for in computer storage?", "Solid State Drive"],
            ["What type of malware locks your files until a payment is made?", "Ransomware"],
            ["What does 'PDF' stand for?", "Portable Document Format"],
            ["What does 'SMS' stand for?", "Short Message Service"],
            ["Which short-range wireless technology pairs headphones with a phone?", "Bluetooth"],
            ["In a mobile network, what is the area served by one base station called?", "A cell"],
            ["What carries most international internet traffic between countries?", "Undersea cables"],
            ["In computing, what does 'OS' stand for?", "Operating System"],
            ["What is the name of the common wired networking standard using RJ45 plugs?", "Ethernet"],
            ["What does a DDoS attack try to do?", "Overwhelm a service so it goes offline"],
            ["In mobile networks, what does 'LTE' stand for?", "Long Term Evolution"],
            ["What is a browser 'cookie'?", "A small piece of data a website stores in your browser"],
            ["What does 'QR' stand for in QR code?", "Quick Response"],
            ["Who is credited with inventing the World Wide Web?", "Tim Berners-Lee"],
            ["What does 'VoIP' stand for?", "Voice over Internet Protocol"],
            ["What is an 'SSID'?", "The name of a Wi-Fi network"],
            ["What does a 'ping' test measure?", "Whether a device can be reached, and how fast"],
            ["What does 'bandwidth' describe on a network link?", "The maximum amount of data it can carry per second"],
            ["What does 'PoE' stand for in networking?", "Power over Ethernet"],
        ];

        // The DOM is static, so resolve every element once instead of on each cycle.
        const questionDiv = document.getElementById('question');
        const answerDiv = document.getElementById('answer');
        const questionText = document.getElementById('question-text');
        const answerText = document.getElementById('answer-text');
        const progressFill = document.getElementById('progress-fill');
        const stage = document.getElementById('stage');

        // Scale the fixed 1920 x 1080 stage to the window, centred, so every
        // pixel size in the CSS holds on any screen.
        function fitStage() {
            const w = window.innerWidth, h = window.innerHeight;
            const k = Math.min(w / 1920, h / 1080);
            stage.style.transform = 'translate(' + (w - 1920 * k) / 2 + 'px,' +
                                    (h - 1080 * k) / 2 + 'px) scale(' + k + ')';
        }
        window.addEventListener('resize', fitStage);
        fitStage();

        // Headline at 96px; if the text needs more than three lines, step it
        // down 4px at a time, to 72px at the least, for this text only.
        function fitText(el) {
            let size = 96;
            el.style.fontSize = '';
            while (size > 72 && Math.round(el.offsetHeight / (size * 1.2)) > 3) {
                size -= 4;
                el.style.fontSize = size + 'px';
            }
        }

        // The player reloads this page for every slide, so it only ever shows one
        // question per run. In-memory state is therefore useless for avoiding
        // repeats - the recently-seen list has to outlive the page.
        const HISTORY_KEY = 'quizRecentQuestions';
        const HISTORY_SIZE = 40;

        function readHistory() {
            try {
                const stored = JSON.parse(window.localStorage.getItem(HISTORY_KEY));
                return Array.isArray(stored) ? stored : [];
            } catch {
                // A player that blocks storage just gets an unfiltered random pick.
                return [];
            }
        }

        function writeHistory(history) {
            try {
                window.localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            } catch {
                // Storage unavailable - occasional repeats are acceptable.
            }
        }

        function nextQuestion() {
            const history = readHistory();
            const unseen = [];
            for (let i = 0; i < quizData.length; i++) {
                if (!history.includes(i)) {
                    unseen.push(i);
                }
            }

            // Once every question has been seen, start the rotation again.
            const exhausted = unseen.length === 0;
            const pool = exhausted ? quizData.map((_, i) => i) : unseen;
            const index = pool[Math.floor(Math.random() * pool.length)];

            const updated = exhausted ? [index] : history.concat(index);
            while (updated.length > HISTORY_SIZE) {
                updated.shift();
            }
            writeHistory(updated);

            return quizData[index];
        }

        let pendingTimeouts = [];

        function schedule(fn, delay) {
            pendingTimeouts.push(setTimeout(fn, delay));
        }

        function cancelAll() {
            pendingTimeouts.forEach(clearTimeout);
            pendingTimeouts = [];
        }

        // The player can load this page before it is on screen (2026-11-19: the
        // answer was showing first), so the cycle (question, then the answer at
        // 10s) repeats with the same question for as long as the page is shown,
        // and only starts once the browser is actually painting the page.
        const CYCLE_MS = 16000;
        let current = null;
        function runQuizCycle(fresh = true) {
            // Drop any timers still pending so a manual skip cannot leave the
            // previous cycle's fades running over the new question.
            cancelAll();

            if (fresh || !current) {
                current = nextQuestion();
            }
            const [question, answer] = current;
            questionText.textContent = question;
            answerText.textContent = answer;
            fitText(questionText);
            fitText(answerText);

            // Return to the start of the cycle with transitions off, so the
            // reset itself is not animated.
            questionDiv.style.transition = 'none';
            questionDiv.style.opacity = '1';
            answerDiv.style.transition = 'none';
            answerDiv.style.opacity = '0';
            progressFill.style.transition = 'none';
            progressFill.style.transform = 'scaleX(0)';

            // Force a reflow so the reset is committed before transitions resume.
            void progressFill.offsetHeight;

            schedule(() => {
                progressFill.style.transition = `transform ${TIMING.ANIMATION_DURATION}ms linear`;
                progressFill.style.transform = 'scaleX(1)';
            }, TIMING.INITIAL_DELAY);

            schedule(() => {
                answerDiv.style.transition = `opacity ${TIMING.FADE_DURATION}ms ease`;
                answerDiv.style.opacity = '1';
            }, TIMING.ANSWER_FADE_IN);
        }

        document.addEventListener('keydown', (event) => {
            if (event.key === ' ' || event.key === 'Enter') {
                event.preventDefault();
                runQuizCycle();
            }
        });

        // requestAnimationFrame does not fire while the page is hidden, so the
        // first cycle waits for the first painted frame.
        requestAnimationFrame(() => requestAnimationFrame(() => runQuizCycle()));
    })();
    </script>
