<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><rect fill='%23002E6D' width='200' height='200'/><text x='50%' y='50%' font-size='120' font-weight='bold' fill='%231E5A7A' text-anchor='middle' dominant-baseline='middle' font-family='Arial'>EGL</text></svg>" type="image/svg+xml">
    <link href="https://fonts.cdnfonts.com/css/neue-power" rel="stylesheet">
    <style>
        /* Modern CSS reset */
        *, *::before, *::after { box-sizing: border-box; }
        * { margin: 0; padding: 0; }
        html, body { height: 100%; }
        img, picture, video, canvas, svg { display: block; max-width: 100%; }
        input, button, textarea, select { font: inherit; }

        /* Main styles */
        body {
            background-color: #1F3050;
            font-family: 'Neue Power', sans-serif;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        h1, h2 {
            font-family: 'Neue Power', sans-serif;
            line-height: 1em;
            text-align: center;
        }

        #question, #answer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 1200px;
            height: calc(100vh - 140px);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transform-origin: center center;
            overflow: hidden;
            opacity: 1;
        }

        /* The answer is stacked over the question and revealed by fading in. */
        #answer {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: clamp(2.5rem, 7vw, 7rem);
            padding: 10px 10px 0;
            margin: 5px;
            color: #ffffff;
            font-weight: 500;
        }

        #question h2, #answer h2 {
            font-size: clamp(2rem, 5vw, 5rem);
            padding: 10px 10px 0;
            color: #F4BEA8;
            font-weight: 500;
            line-height: 1.3;
            overflow-wrap: break-word;
            hyphens: auto;
        }

        #bar {
            display: flex;
            position: absolute;
            bottom: 60px;
            width: 100%;
            height: 60px;
            align-items: center;
        }

        #leftbar, #rightbar {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 20px;
            margin: 10px;
        }

        #leftbar {
            background-color: #E76851;
            left: 0;
        }

        #rightbar {
            background-color: #ffffff;
            right: 0;
        }

        .logo-left {
            position: absolute;
            width: 200px;
            height: auto;
            top: 30px;
            left: 30px;
        }

        .logo {
            position: absolute;
            width: 220px;
            top: 30px;
            right: 30px;
        }

        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .logo-left {
                width: 130px;
                top: 20px;
                left: 20px;
            }

            .logo {
                width: 150px;
                top: 20px;
                right: 20px;
            }

            #question, #answer {
                width: 90%;
            }
        }
    </style>
</head>

                <path class="cls-2" d="M2413.48,0l.02,84.48c1.97,16.89,7.62,30,23.47,37.53,23.84,11.32,54.73,8.27,80.51,8.99v69h-104v128.5c0,4.92,5.59,19.01,9.02,22.98,3.09,3.57,13.02,9.52,17.48,9.52h77.5v78l-104.54.04c-51.73-3.29-77.16-39.63-81.45-88.55v-150.49h-67.01v-69h152l-30.21-3.29c-66.4-13-54.49-75.37-55.79-127.71h83Z"/>

    <div id="question">
        <h1>Q:</h1>
        <h2 id="question-text">Loading question...</h2>
    </div>

    <div id="answer">
        <h1>A:</h1>
        <h2 id="answer-text">Loading answer...</h2>
    </div>

    <div id="bar">
        <div id="leftbar"></div>
        <div id="rightbar"></div>
    </div>

    <script>
    (function () {
        'use strict';

        // Cycle timings in milliseconds, measured from page load.
        //
        // The player reloads this page for each slide and gives it a 16s slot,
        // so everything must land inside that budget: the bar sweep finishes at
        // 10s exactly as the answer appears, leaving ~6s to read the answer
        // before the playlist moves on. If the slot length changes in the
        // CommBox console, these need to change with it.
        const TIMING = {
            INITIAL_DELAY: 2000,
            ANIMATION_DURATION: 8000,
            FADE_DURATION: 250,
            QUESTION_FADE_OUT: 9750,
            ANSWER_FADE_IN: 10000
        };

        const BAR_MIN_WIDTH = 40;
        const BAR_MARGIN = 70;

        // NZ trivia questions
        const quizData = [
            ['What is the capital city of New Zealand?', 'Wellington'],
            ['What is New Zealand\'s largest city by population?', 'Auckland'],
            ['What is the highest mountain in New Zealand?', 'Aoraki / Mount Cook'],
            ['What is the longest river in New Zealand?', 'Waikato River'],
            ['Which West Coast glacier shares its name with a 19th-century Austrian emperor?', 'Franz Josef Glacier'],
            ['Which strait separates the North and South Islands?', 'Cook Strait'],
            ['What is the southernmost city in New Zealand?', 'Invercargill'],
            ['Which national park is home to Milford Sound?', 'Fiordland National Park'],
            ['What is the name of New Zealand\'s third largest island?', 'Stewart Island'],
            ['Which city is known as the "Garden City"?', 'Christchurch'],
            ['What is the name of the active volcanic island near Whakatane, also known as White Island?', 'Whakaari'],
            ['What is the Maori name for New Zealand?', 'Aotearoa'],
            ['Which mountain range runs down much of the South Island?', 'Southern Alps'],
            ['What is the name of the famous fiord in Fiordland dominated by Mitre Peak?', 'Milford Sound'],
            ['Which region is famous for its geothermal activity, geysers and mud pools?', 'Rotorua'],
            ['Which cape at the top of the North Island is, in Maori tradition, the departing place of spirits?', 'Cape Reinga'],
            ['Which city is nicknamed the "City of Sails"?', 'Auckland'],
            ['What is the name of the famous glowworm caves near Otorohanga?', 'Waitomo Caves'],
            ['Which North Island lake sits in the crater of a supervolcano?', 'Lake Taupō'],
            ['What two tectonic plates meet beneath New Zealand?', 'Australian and Pacific plates'],
            ['What strait separates Stewart Island from the South Island?', 'Foveaux Strait'],
            ['In which national park would you find Aoraki / Mount Cook?', 'Aoraki / Mount Cook National Park'],
            ['Which Dunedin street holds the record for the steepest street in the world?', 'Baldwin Street'],
            ['In which city is New Zealand\'s Parliament, known as the Beehive, located?', 'Wellington'],
            ['Which historic Bay of Islands town was New Zealand\'s first European settlement?', 'Russell'],
            ['What is the name of the traditional Maori war dance performed by the All Blacks?', 'Haka'],
            ['What is the name of New Zealand\'s national rugby union team?', 'All Blacks'],
            ['What are New Zealanders commonly nicknamed?', 'Kiwis'],
            ['Which small flightless bird is a national symbol of New Zealand?', 'Kiwi'],
            ['What is the name of a traditional Maori meeting house?', 'Wharenui'],
            ['What is the name of the traditional Maori greeting made by pressing noses together?', 'Hongi'],
            ['Which New Zealand film director made "The Lord of the Rings" trilogy?', 'Peter Jackson'],
            ['What is New Zealand\'s national day, marking the signing of its founding treaty?', 'Waitangi Day'],
            ['Alongside English and NZ Sign Language, which is an official language of New Zealand?', 'Maori (Te Reo Maori)'],
            ['What is the name of the traditional Maori skin tattoo?', 'Ta moko'],
            ['What is the name of the meringue-based dessert both New Zealand and Australia claim to have invented?', 'Pavlova'],
            ['What is the name of a traditional Maori feast cooked in an underground earth oven?', 'Hangi'],
            ['New Zealand\'s Black Sox are a world-leading team in which sport?', 'Softball'],
            ['Which frond-shaped plant is a widely used symbol of New Zealand sports teams?', 'Silver fern'],
            ['Which New Zealand singer won two Grammy Awards for her hit song "Royals"?', 'Lorde'],
            ['Which New Zealand mountaineer was the first person confirmed to reach the summit of Mount Everest?', 'Sir Edmund Hillary'],
            ['What is the name of the traditional Maori dance performed while swinging balls on strings?', 'Poi'],
            ['What are the indigenous people of New Zealand called?', 'Maori'],
            ['What is the Maori word for an extended family group?', 'Whanau'],
            ['What Maori word describes a person or thing\'s prestige, authority or spiritual power?', 'Mana'],
            ['What is the name of the Maori New Year, marked by a public holiday since 2022?', 'Matariki'],
            ['What is the name of the classic New Zealand children\'s clockwork toy, a yellow and black bee?', 'Buzzy Bee'],
            ['What is the name of New Zealand\'s own dark, salty yeast-extract spread, similar to Vegemite?', 'Marmite'],
            ['What is the New Zealand word for the footwear known elsewhere as flip-flops?', 'Jandals'],
            ['What Kiwi slang phrase, using an incomplete comparison, means "great" or "no problem"?', 'Sweet as'],
            ['In what year was the Treaty of Waitangi signed?', '1840'],
            ['Which British explorer first charted New Zealand\'s coastline in 1769?', 'Captain James Cook'],
            ['What was the name of the ship Captain Cook sailed to New Zealand in?', 'HMS Endeavour'],
            ['In what year did New Zealand become the first self-governing country to grant women the right to vote?', '1893'],
            ['What was New Zealand\'s first capital, before the seat of government moved to Auckland?', 'Okiato (Old Russell)'],
            ['In what year did Wellington replace Auckland as New Zealand\'s capital?', '1865'],
            ['Who became New Zealand\'s first female Prime Minister, taking office in 1997?', 'Jenny Shipley'],
            ['Who was New Zealand\'s first Premier (Prime Minister)?', 'Henry Sewell'],
            ['ANZAC troops landed at Gallipoli during which conflict?', 'World War I'],
            ['What does the acronym ANZAC stand for?', 'Australian and New Zealand Army Corps'],
            ['In what year did New Zealand formally adopt the Statute of Westminster, confirming its full independence?', '1947'],
            ['The 19th-century New Zealand Wars were primarily fought over what issue?', 'Land disputes between Maori and the Crown/settlers'],
            ['Which New Zealand aviator is credited with an early powered flight around the same time as the Wright brothers?', 'Richard Pearse'],
            ['According to archaeological evidence, in which century did Polynesian settlers first arrive in New Zealand?', '13th century'],
            ['What is the name of the Maori king movement founded in the 1850s?', 'Kingitanga'],
            ['Which New Zealand city was devastated by a major earthquake in 1931?', 'Napier'],
            ['In what year was New Zealand\'s current national flag adopted?', '1902'],
            ['In 1985, French agents bombed and sank which Greenpeace ship in Auckland Harbour?', 'Rainbow Warrior'],
            ['In what year did New Zealand declare itself a nuclear-free zone?', '1987'],
            ['Who led the campaign that won New Zealand women the vote in 1893?', 'Kate Sheppard'],
            ['Which South Island region experienced a major gold rush in the 1860s?', 'Otago'],
            ['Who was the naval officer who signed the Treaty of Waitangi on behalf of the British Crown?', 'William Hobson'],
            ['In which decade did New Zealand send combat troops to fight in the Vietnam War?', '1960s'],
            ['In what year did New Zealand pass the Old Age Pensions Act, among the first in the world?', '1898'],
            ['What is the name of the 1981 rugby tour that sparked widespread protests over apartheid?', 'The Springbok Tour'],
            ['Which internet protocol replaced IPv4 to provide far more addresses?', 'IPv6'],
            ['In a fibre network, what does the \'last mile\' refer to?', 'The final stretch of network into the customer\'s premises'],
            ['Broadband speed is normally quoted in which unit?', 'Megabits per second (Mbps)'],
            ['What does "HTTP" stand for?', 'HyperText Transfer Protocol'],
            ['What does "SIM", as in SIM card, stand for?', 'Subscriber Identity Module'],
            ['What does "GPS" stand for?', 'Global Positioning System'],
            ['What does "RAM" stand for?', 'Random Access Memory'],
            ['What is the main advantage of fibre optic cable over copper cable?', 'Higher speed and immunity to electromagnetic interference'],
            ['What does the "G" refer to in "5G" mobile networks?', 'Generation'],
            ['What does "VPN" stand for?', 'Virtual Private Network'],
            ['In networking, what does \'latency\' measure?', 'The delay for data to travel between two points'],
            ['What does "USB" stand for?', 'Universal Serial Bus'],
            ['Which company developed the Android operating system?', 'Google'],
            ['What is happening when a video is \'buffering\'?', 'Data is being loaded ahead of playback'],
            ['What is two-factor authentication?', 'A login needing a second proof of identity as well as a password'],
            ['What is the term for fraudulent messages designed to trick people into revealing personal information?', 'Phishing'],
            ['What does "ONT" stand for in a fibre broadband installation?', 'Optical Network Terminal'],
            ['What does encryption do to data?', 'Scrambles it so only someone with the key can read it'],
            ['What is the smallest unit of digital data called?', 'Bit'],
            ['What is a firmware update?', 'An update to the software built into a device'],
            ['What does the "IP" in "IP address" stand for?', 'Internet Protocol'],
            ['What is the main purpose of a firewall?', 'To control incoming and outgoing network traffic for security'],
            ['What does "AI" stand for?', 'Artificial Intelligence'],
            ['What does "ISP" stand for?', 'Internet Service Provider'],
            ['What does "CCTV" stand for?', 'Closed-Circuit Television'],
        ];

        // The DOM is static, so resolve every element once instead of on each cycle.
        const questionDiv = document.getElementById('question');
        const answerDiv = document.getElementById('answer');
        const questionText = document.getElementById('question-text');
        const answerText = document.getElementById('answer-text');
        const leftBar = document.getElementById('leftbar');
        const rightBar = document.getElementById('rightbar');

        // The player reloads this page for every slide, so it only ever shows one
        // question per run. In-memory state is therefore useless for avoiding
        // repeats - the recently-seen list has to outlive the page.
        const HISTORY_KEY = 'quizRecentQuestions';
        const HISTORY_SIZE = 40;

        function readHistory() {
            try {
                const stored = JSON.parse(window.localStorage.getItem(HISTORY_KEY));
                return Array.isArray(stored) ? stored : [];
            } catch {
                // A player that blocks storage just gets an unfiltered random pick.
                return [];
            }
        }

        function writeHistory(history) {
            try {
                window.localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            } catch {
                // Storage unavailable - occasional repeats are acceptable.
            }
        }

        function nextQuestion() {
            const history = readHistory();
            const unseen = [];
            for (let i = 0; i < quizData.length; i++) {
                if (!history.includes(i)) {
                    unseen.push(i);
                }
            }

            // Once every question has been seen, start the rotation again.
            const exhausted = unseen.length === 0;
            const pool = exhausted ? quizData.map((_, i) => i) : unseen;
            const index = pool[Math.floor(Math.random() * pool.length)];

            const updated = exhausted ? [index] : history.concat(index);
            while (updated.length > HISTORY_SIZE) {
                updated.shift();
            }
            writeHistory(updated);

            return quizData[index];
        }

        let pendingTimeouts = [];

        function schedule(fn, delay) {
            pendingTimeouts.push(setTimeout(fn, delay));
        }

        function cancelAll() {
            pendingTimeouts.forEach(clearTimeout);
            pendingTimeouts = [];
        }

        function maxBarWidth() {
            return Math.max(BAR_MIN_WIDTH, window.innerWidth - BAR_MARGIN);
        }

        function runQuizCycle() {
            // Drop any timers still pending so a manual skip cannot leave the
            // previous cycle's fades running over the new question.
            cancelAll();

            const [question, answer] = nextQuestion();
            questionText.textContent = question;
            answerText.textContent = answer;

            const fullWidth = maxBarWidth();

            // Return to the start of the cycle with transitions off, so the
            // reset itself is not animated.
            questionDiv.style.transition = 'none';
            questionDiv.style.opacity = '1';
            questionDiv.style.transform = 'translateX(-50%) scale(1)';
            answerDiv.style.transition = 'none';
            answerDiv.style.opacity = '0';
            leftBar.style.transition = 'none';
            rightBar.style.transition = 'none';
            leftBar.style.width = BAR_MIN_WIDTH + 'px';
            rightBar.style.width = fullWidth + 'px';

            // Force a reflow so the reset is committed before transitions resume.
            void leftBar.offsetHeight;

            schedule(() => {
                const barTransition = `width ${TIMING.ANIMATION_DURATION}ms linear`;
                leftBar.style.transition = barTransition;
                rightBar.style.transition = barTransition;
                questionDiv.style.transition = `transform ${TIMING.ANIMATION_DURATION}ms linear`;
                questionDiv.style.transform = 'translateX(-50%) scale(1.15)';
                leftBar.style.width = fullWidth + 'px';
                rightBar.style.width = BAR_MIN_WIDTH + 'px';
            }, TIMING.INITIAL_DELAY);

            schedule(() => {
                questionDiv.style.transition = `opacity ${TIMING.FADE_DURATION}ms ease`;
                questionDiv.style.opacity = '0';
            }, TIMING.QUESTION_FADE_OUT);

            schedule(() => {
                answerDiv.style.transition = `opacity ${TIMING.FADE_DURATION}ms ease`;
                answerDiv.style.opacity = '1';
            }, TIMING.ANSWER_FADE_IN);
        }

        // Resize fires in bursts while a window is dragged; only the final size matters.
        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const fullWidth = maxBarWidth();
                // Whichever bar is currently expanded keeps the full width.
                if (parseFloat(leftBar.style.width) > BAR_MIN_WIDTH) {
                    leftBar.style.width = fullWidth + 'px';
                } else {
                    rightBar.style.width = fullWidth + 'px';
                }
            }, 150);
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === ' ' || event.key === 'Enter') {
                event.preventDefault();
                runQuizCycle();
            }
        });

        runQuizCycle();
    })();
    </script>
